services:
  # Local S3 API in front of private OCI bucket mattermost-files (rclone + instance principal).
  filestore-s3:
    # 1.74.4+ fixes spurious 404 on HEAD/GET during VFS writeback (rclone#8188),
    # which broke Mattermost image preview/thumbnail generation right after upload.
    image: rclone/rclone:1.74.4
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - serve
      - s3
      - "oci-files:"
      - --addr
      - ":9000"
      - --auth-key
      - ${MM_FILESETTINGS_AMAZONS3ACCESSKEYID},${MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY}
      - --vfs-cache-mode
      - full
      - --vfs-cache-max-size
      - 2G
    volumes:
      - ./rclone/rclone.conf:/config/rclone/rclone.conf:ro
    mem_limit: 256m

  # Postgres tuning targets a 12 GB / 2 OCPU free-tier host. See docs/14-performance.md.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2048MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      MM_PROD_DB_NAME: ${MM_PROD_DB_NAME}
      MM_PROD_DB_USER: ${MM_PROD_DB_USER}
      MM_PROD_DB_PASSWORD: ${MM_PROD_DB_PASSWORD}
      MM_TEST_DB_NAME: ${MM_TEST_DB_NAME}
      MM_TEST_DB_USER: ${MM_TEST_DB_USER}
      MM_TEST_DB_PASSWORD: ${MM_TEST_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mattermost-prod:
    image: local/mattermost-arm64:${MM_VERSION}
    build:
      context: ./mattermost-arm64
      args:
        MM_VERSION: ${MM_VERSION}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      filestore-s3:
        condition: service_started
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 3750MiB
      MM_SERVICESETTINGS_SITEURL: https://${PROD_HOSTNAME}
      MM_SERVICESETTINGS_LISTENADDRESS: :8000
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${MM_PROD_DB_USER}:${MM_PROD_DB_PASSWORD}@postgres:5432/${MM_PROD_DB_NAME}?sslmode=disable&connect_timeout=10
      MM_SQLSETTINGS_MAXOPENCONNS: "25"
      MM_SQLSETTINGS_MAXIDLECONNS: "10"
      MM_FILESETTINGS_DIRECTORY: /mattermost/data/
      MM_FILESETTINGS_DRIVERNAME: ${MM_FILESETTINGS_DRIVERNAME:-amazons3}
      MM_FILESETTINGS_MAXFILESIZE: ${MM_FILESETTINGS_MAXFILESIZE:-52428800}
      MM_FILESETTINGS_ENABLEFILEATTACHMENTS: ${MM_FILESETTINGS_ENABLEFILEATTACHMENTS:-true}
      MM_FILESETTINGS_AMAZONS3BUCKET: ${MM_FILESETTINGS_AMAZONS3BUCKET}
      MM_FILESETTINGS_AMAZONS3ENDPOINT: ${MM_FILESETTINGS_AMAZONS3ENDPOINT:-filestore-s3:9000}
      MM_FILESETTINGS_AMAZONS3REGION: ${MM_FILESETTINGS_AMAZONS3REGION}
      MM_FILESETTINGS_AMAZONS3ACCESSKEYID: ${MM_FILESETTINGS_AMAZONS3ACCESSKEYID}
      MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: ${MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY}
      MM_FILESETTINGS_AMAZONS3PATHPREFIX: prod/
      MM_FILESETTINGS_AMAZONS3SSL: ${MM_FILESETTINGS_AMAZONS3SSL:-false}
      MM_FILESETTINGS_AMAZONS3SSE: ${MM_FILESETTINGS_AMAZONS3SSE:-false}
      MM_PLUGINSETTINGS_DIRECTORY: /mattermost/plugins/
      MM_PLUGINSETTINGS_CLIENTDIRECTORY: /mattermost/client/plugins/
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      MM_CALLS_UDP_SERVER_ADDRESS: ${MM_CALLS_UDP_SERVER_ADDRESS:-0.0.0.0}
      MM_CALLS_UDP_SERVER_PORT: ${MM_CALLS_UDP_SERVER_PORT:-8443}
      MM_CALLS_ICE_HOST_OVERRIDE: ${MM_CALLS_ICE_HOST_OVERRIDE}
      MM_CALLS_DEFAULT_ENABLED: "true"
      MM_CALLS_ENABLE_VIDEO: "true"
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "false"
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_PASSWORDSETTINGS_MINIMUMLENGTH: "14"
      MM_PASSWORDSETTINGS_LOWERCASE: "true"
      MM_PASSWORDSETTINGS_UPPERCASE: "true"
      MM_PASSWORDSETTINGS_NUMBER: "true"
      MM_PASSWORDSETTINGS_SYMBOL: "true"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: ${MM_PLUGINSETTINGS_ENABLEUPLOADS:-false}
      MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "true"
      MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: ${MM_PUSH_NOTIFICATION_SERVER:-https://global.push.mattermost.com}
    volumes:
      - prod-config:/mattermost/config
      - prod-data:/mattermost/data
      - prod-logs:/mattermost/logs
      - prod-plugins:/mattermost/plugins
      - prod-client-plugins:/mattermost/client/plugins
      - prod-bleve:/mattermost/bleve-indexes
    ports:
      - "8443:8443/udp"
    mem_limit: 4g

  mattermost-test:
    profiles: [upgrade-test]
    image: local/mattermost-arm64:${MM_VERSION}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      filestore-s3:
        condition: service_started
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 1800MiB
      MM_SERVICESETTINGS_SITEURL: https://${TEST_HOSTNAME}
      MM_SERVICESETTINGS_LISTENADDRESS: :8000
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${MM_TEST_DB_USER}:${MM_TEST_DB_PASSWORD}@postgres:5432/${MM_TEST_DB_NAME}?sslmode=disable&connect_timeout=10
      MM_FILESETTINGS_DIRECTORY: /mattermost/data/
      MM_FILESETTINGS_DRIVERNAME: ${MM_FILESETTINGS_DRIVERNAME:-amazons3}
      MM_FILESETTINGS_MAXFILESIZE: ${MM_FILESETTINGS_MAXFILESIZE:-52428800}
      MM_FILESETTINGS_ENABLEFILEATTACHMENTS: ${MM_FILESETTINGS_ENABLEFILEATTACHMENTS:-true}
      MM_FILESETTINGS_AMAZONS3BUCKET: ${MM_FILESETTINGS_AMAZONS3BUCKET}
      MM_FILESETTINGS_AMAZONS3ENDPOINT: ${MM_FILESETTINGS_AMAZONS3ENDPOINT:-filestore-s3:9000}
      MM_FILESETTINGS_AMAZONS3REGION: ${MM_FILESETTINGS_AMAZONS3REGION}
      MM_FILESETTINGS_AMAZONS3ACCESSKEYID: ${MM_FILESETTINGS_AMAZONS3ACCESSKEYID}
      MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: ${MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY}
      MM_FILESETTINGS_AMAZONS3PATHPREFIX: test/
      MM_FILESETTINGS_AMAZONS3SSL: ${MM_FILESETTINGS_AMAZONS3SSL:-false}
      MM_FILESETTINGS_AMAZONS3SSE: ${MM_FILESETTINGS_AMAZONS3SSE:-false}
      MM_PLUGINSETTINGS_DIRECTORY: /mattermost/plugins/
      MM_PLUGINSETTINGS_CLIENTDIRECTORY: /mattermost/client/plugins/
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
    volumes:
      - test-config:/mattermost/config
      - test-data:/mattermost/data
      - test-logs:/mattermost/logs
      - test-plugins:/mattermost/plugins
      - test-client-plugins:/mattermost/client/plugins
      - test-bleve:/mattermost/bleve-indexes
    mem_limit: 2g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - mattermost-prod
    environment:
      PROD_HOSTNAME: ${PROD_HOSTNAME}
      TEST_HOSTNAME: ${TEST_HOSTNAME}
      TEST_ALLOWED_CIDR: ${TEST_ALLOWED_CIDR}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  prod-config:
  prod-data:
  prod-logs:
  prod-plugins:
  prod-client-plugins:
  prod-bleve:
  test-config:
  test-data:
  test-logs:
  test-plugins:
  test-client-plugins:
  test-bleve:
  caddy-data:
  caddy-config:
