name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.x

      - name: OpenTofu init
        run: tofu -chdir=infra/opentofu init -backend=false

      - name: Repo audit
        run: scripts/security-audit.sh --repo-only

      - name: OpenTofu validate
        run: tofu -chdir=infra/opentofu validate

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Detect secrets
        run: gitleaks detect --no-git --redact --source .
